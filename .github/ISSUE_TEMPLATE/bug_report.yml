name: Bug report
description: Track a reproducible AscensionOS issue.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What broke?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Keep this concrete enough to replay.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Landing
        - Login/Auth
        - Dashboard
        - Check-in
        - Memory Graph
        - Weekly Review / AI
        - Settings
        - Android APK / S23 telemetry
        - Supabase sync
        - PWA/offline
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Device / browser / logs
      description: Include phone model, browser, route, console logs, or screenshots when useful.
