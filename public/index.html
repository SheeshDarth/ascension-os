<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030507" />
    <title>AscensionOS</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #030507; color: #f5fbfc; }

      main { max-width: 360px; }

  <body>
    <main>
      <h1>AscensionOS</h1>
      <p>Native shell ready. Build with <code>CAPACITOR_SERVER_URL</code> set to the deployed AscensionOS URL.</p>
